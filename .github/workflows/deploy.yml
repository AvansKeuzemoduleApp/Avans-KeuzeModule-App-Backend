name: Build, Push, and Deploy via SSH (to portainer)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Semgrep']
    types: [completed]

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    env:
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repo name for tags and paths
        shell: bash
        run: |
          echo "REPO_NAME_LOWER=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (with verbose logs)
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:${{ github.sha }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:latest -o json > sbom.json

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan SBOM for vulnerabilities
        run: |
          grype sbom:sbom.json --fail-on critical

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Show whether SSH_PASSPHRASE is present (masked)
        if: always()
        shell: bash
        run: |
          if [ -n "${{ secrets.SSH_PASSPHRASE }}" ]; then
            echo "SSH_PASSPHRASE is set"
          else
            echo "SSH_PASSPHRASE is NOT set"
          fi

      - name: Copy docker-compose.yml to VPS (with passphrase)
        if: ${{ env.SSH_PASSPHRASE != '' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: 'docker-compose.yml'
          target: '/home/sysadmin/${{ github.event.repository.name }}/'

      - name: Copy docker-compose.yml to VPS (no passphrase)
        if: ${{ env.SSH_PASSPHRASE == '' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: 'docker-compose.yml'
          target: '/home/sysadmin/${{ github.event.repository.name }}/'

      - name: Deploy to VPS via SSH (with passphrase)
        if: ${{ env.SSH_PASSPHRASE != '' }}
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            cd /home/sysadmin/${{ github.event.repository.name }}
            docker-compose pull
            docker-compose down || true
            docker-compose up -d --remove-orphans

            echo "Waiting for backend to become healthy..."
            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' avans-keuzemodule-backend)
              echo "Current status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' avans-keuzemodule-backend)
            if [ "$STATUS" != "healthy" ]; then
              echo "Backend never became healthy, rolling back..."
              docker-compose down || true
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable
              docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable \
                         ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:latest
              docker-compose up -d --remove-orphans
              sleep 5
              docker-compose ps
              exit 1
            fi

            echo "Backend is healthy!"
            docker-compose ps

      - name: Deploy to VPS via SSH (no passphrase)
        if: ${{ env.SSH_PASSPHRASE == '' }}
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            cd /home/sysadmin/${{ github.event.repository.name }}
            docker-compose pull
            docker-compose down || true
            docker-compose up -d --remove-orphans

            echo "Waiting for backend to become healthy..."
            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' avans-keuzemodule-backend)
              echo "Current status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' avans-keuzemodule-backend)
            if [ "$STATUS" != "healthy" ]; then
              echo "Backend never became healthy, rolling back..."
              docker-compose down || true
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable
              docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable \
                         ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:latest
              docker-compose up -d --remove-orphans
              sleep 5
              docker-compose ps
              exit 1
            fi

            echo "Backend is healthy!"
            docker-compose ps

      - name: Tag current version as stable
        if: success()
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:${{ github.sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME_LOWER }}:stable
