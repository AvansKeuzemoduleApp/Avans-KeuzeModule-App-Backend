name: Backend Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run linter (warnings only)
        run: npm run lint
        continue-on-error: true
      - name: Run all tests with coverage
        run: npm run test:cov
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}
          DUMMY_HASH: ${{ secrets.DUMMY_HASH }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          COOKIE_SAMESITE: ${{ secrets.COOKIE_SAMESITE }}
          AUTH_COOKIE_ACCESS: ${{ secrets.AUTH_COOKIE_ACCESS }}
          AUTH_COOKIE_REFRESH: ${{ secrets.AUTH_COOKIE_REFRESH }}
          ACCESS_TOKEN_EXPIRES_IN_SECONDS: ${{ secrets.ACCESS_TOKEN_EXPIRES_IN_SECONDS }}
          REFRESH_TOKEN_EXPIRES_IN_SECONDS: ${{ secrets.REFRESH_TOKEN_EXPIRES_IN_SECONDS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
