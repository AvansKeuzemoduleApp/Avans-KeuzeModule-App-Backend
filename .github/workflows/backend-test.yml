name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run linter (warnings only)
        run: npm run lint
        continue-on-error: true
      - name: Run all tests with coverage
        run: npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password_123
          DB_NAME: test_keuzekompas_db
          BCRYPT_ROUNDS: 10
          DUMMY_HASH: $2b$10$abcdefghijklmnopqrstuvwxyz1234567890123456789012
          COOKIE_SECURE: 'false'
          COOKIE_SAMESITE: lax
          AUTH_COOKIE_ACCESS: test_access_token
          AUTH_COOKIE_REFRESH: test_refresh_token
          ACCESS_TOKEN_EXPIRES_IN_SECONDS: 3600
          REFRESH_TOKEN_EXPIRES_IN_SECONDS: 86400
          JWT_SECRET: test_jwt_secret_for_ci_testing_only_1234567890
          CORS_ORIGINS: http://localhost:3000
