version: '3.8'

services:
  backend:
    image: wasssiim/avans-keuzemodule-app-backend:latest
    container_name: avans-keuzemodule-backend
    restart: unless-stopped
    ports:
      - "3000"
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    external: true
    name: app-network

